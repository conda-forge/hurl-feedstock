{% set version = "8.1.0" %}

package:
  name: hurl
  version: {{ version }}

source:
  - url: https://github.com/Orange-OpenSource/hurl/archive/{{ version }}.tar.gz
    sha256: 2e45678806a8a1c7307d4b4298b11aab6d947799bdce986c67fd9c693dac98a5
    patches:
      # Use the patched libxml crate below <https://github.com/KWARC/rust-libxml/issues/179>
      - cargo-toml-libxml-0.3.22.patch  # [win]
  # libxml crate patched to find libxml2 with pkg-config on Windows msvc (and generate bindings with bindgen).
  - url: https://crates.io/api/v1/crates/libxml/0.3.22/download  # [win]
    fn: libxml-0.3.22.tar.gz  # [win]
    sha256: 1157d8bc7a14d07445541827e7a9c80fc5939718b43a973cf7e666d3ab5035fb  # [win]
    folder: patch/rust-libxml-0.3.22  # [win]
    patches:  # [win]
      - libxml-0.3.22-pkg-config-windows.patch  # [win]

build:
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cargo-bundle-licenses
    - pkg-config
    # libxml crate generates its bindings with bindgen (requires libclang).
    - clang
    - libclang
  host:
    - openssl
    - libxml2-devel
    - libcurl
  run:

test:
  commands:
    - hurl --version
    - hurlfmt --version
    - echo HEAD https://hurl.dev | hurl --include --no-color

about:
  home: https://hurl.dev
  summary: Run and Test HTTP Requests with plain text and curl
  description: |
    Hurl is a command line tool that runs HTTP requests defined in a simple plain text format.

    It can chain requests, capture values and evaluate queries on headers and body response. Hurl is very 
    versatile: it can be used for both fetching data and testing HTTP sessions.

    Hurl makes it easy to work with HTML content, REST / SOAP / GraphQL APIs, or any other XML / JSON based APIs.

  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  doc_url: https://hurl.dev
  dev_url: https://github.com/Orange-OpenSource/hurl


extra:
  recipe-maintainers:
    - jcamiel
